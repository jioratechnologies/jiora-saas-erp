server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS at 127.0.0.11; resolver + variable forces nginx to
    # re-resolve "api" on every request instead of caching its IP for the
    # life of the worker process (needed since the api container can be
    # redeployed/restarted independently of this one).
    resolver 127.0.0.11 valid=10s;

    # Same-origin API proxy: the browser only ever talks to this frontend
    # domain. Requests to /api/* are forwarded to the api service over the
    # internal Docker network — apps/api itself is never given a public
    # Traefik route. Set VITE_API_BASE_URL=/api at build time to match.
    location /api/ {
        # A variable in proxy_pass disables nginx's normal location-prefix
        # stripping (needed here so `resolver` actually re-resolves "api" —
        # see comment above) — so /api/health was reaching the api container
        # as bare "/" instead of "/health". rewrite ... break strips the
        # /api prefix explicitly first; proxy_pass then has no trailing URI
        # of its own, so nginx forwards the already-rewritten $request_uri
        # unmodified.
        # Target is the Kong gateway (kong:8000), which routes to the
        # backend service(s); see infra/kong/kong.yml.
        set $api_upstream kong;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # keepalive to kong
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain text/css text/xml image/svg+xml;

    # SPA routing: any path that isn't a real file falls back to index.html,
    # so React Router (e.g. /admin/roles, /callback) handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
