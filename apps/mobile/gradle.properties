org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── Attendance mode switch ───────────────────────────────────────────
# dev        → BuildConfig.ATTENDANCE_MODE = "dev". Convenience-only in
#              this build (device/security enforcement is decided server
#              side — see ATTENDANCE_PLAN.md D2/D6); reserved for any
#              future dev-only bypass (e.g. mock GPS providers used for
#              testing without tripping local warnings).
# production → BuildConfig.ATTENDANCE_MODE = "production". Required for
#              a release build; the build FAILS CLOSED if this property is
#              missing or misspelled rather than silently defaulting to dev
#              — see app/build.gradle.kts.
#
# Override per machine in a gitignored local.properties, or via
# `-PattendanceMode=production` on the CLI / CI.
attendanceMode=dev
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
