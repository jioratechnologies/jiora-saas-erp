# Main production app stack. Postgres and object storage are separate
# resources (see docs/deployment/PRODUCTION_DEPLOY.md) — this file only has
# what talks to them. Object storage is deployed from
# docker-compose.minio.yaml (or any other S3-compatible service) — its own
# resource, since apps/api talks to it as a generic S3 endpoint.
#
# No `ports:` anywhere. Every service sits on `saas-erp-internal` (shared
# with the Postgres and MinIO resources). `web`, `zitadel`, and `api` also
# join `dokploy-network`, the network Dokploy's own Traefik listens on (see
# that network's own comment further down for naming notes). `api` does get
# a public route — needed for the mobile app, which can't use web's
# same-origin nginx `/api/*` proxy trick the way a browser can (see
# apps/web/nginx.conf) — but the browser itself still only ever calls
# `web`'s own domain; `CORS_ALLOWED_ORIGINS` locks `api` to that origin for
# any browser-based caller regardless.
#
# Usage:
#   docker network create saas-erp-internal   # once, if it doesn't exist yet
#   mkdir -p /data/saas-erp/mongo /data/saas-erp/redis   # once — fixed host
#                                              # paths, survive this resource
#                                              # being deleted and recreated by
#                                              # whatever's managing it (named
#                                              # volumes get a new per-resource
#                                              # identifier and start empty on
#                                              # most PaaS-style Docker hosts —
#                                              # same issue docker-compose.minio.yaml
#                                              # hit)
#   cp .env.deploy.example .env                 # fill in every value, see below
#   docker compose -f docker-compose.production.yaml up -d --build
#
# Required env additions beyond .env.deploy.example (external Postgres and
# object storage, since both resources are deployed separately, not by this
# file):
#   POSTGRES_HOST            internal hostname/service-name your host gives
#                             the Postgres resource (check its connection
#                             details page)
#   POSTGRES_PORT             usually 5432
#   OBJECT_STORAGE_ENDPOINT   object storage's S3 API host, no scheme/port
#                             (its presigned URLs go straight to the browser,
#                             so this has to be the public hostname, not an
#                             internal service name — see PRODUCTION_DEPLOY.md)
#   WEB_DOMAIN                e.g. app.your-domain.example
#   API_DOMAIN                e.g. api.your-domain.example — what the mobile
#                             app points its baseUrl at
#   ZITADEL_DOMAIN            e.g. auth.your-domain.example — must match
#                             ZITADEL_ISSUER's host
#   RESEND_API_KEY            from Resend's dashboard — used as the SMTP
#                             password Zitadel authenticates with
#   RESEND_FROM_ADDRESS       must be on a domain verified in Resend, or
#                             every send fails
#   RESEND_FROM_NAME          optional, defaults to "Jiora SaaS ERP"

services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      # app_runtime, not the table owner — see infra/postgres/init for why,
      # and docs/deployment/PRODUCTION_DEPLOY.md for how to create this role
      # on the standalone Postgres resource.
      DATABASE_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-saaserp}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: "search_path,extra_float_digits"
    networks:
      - saas-erp-internal

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${POSTGRES_USER:-saaserp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: saaserp_audit
    volumes:
      - /data/saas-erp/mongo:/data/db
    networks:
      - saas-erp-internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - /data/saas-erp/redis:/data
    networks:
      - saas-erp-internal

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    restart: unless-stopped
    # --tlsMode external (not "disabled"!): per Zitadel's own cmd/tls/tls.go,
    # this flag *always* overwrites externalSecure/tls.enabled, ignoring
    # ZITADEL_EXTERNALSECURE entirely. "disabled" sets tls.enabled=false AND
    # externalSecure=false — wrong for a reverse-proxy setup, and the actual
    # cause of Console's environment.json advertising "http://" instead of
    # "https://" (browsers then block every post-login API call as mixed
    # content). "external" is the mode built for exactly this: Traefik
    # terminates TLS, Zitadel stays plain HTTP internally, but still
    # correctly tells clients it's reachable over HTTPS externally.
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode external
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: ${POSTGRES_HOST}
      ZITADEL_DATABASE_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER:-saaserp}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-saaserp}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "true"
      # Defaults to 8080 if unset, which leaks into self-advertised URLs
      # (Console's environment.json "api" field showed
      # "http://<domain>:8080" instead of "https://<domain>" without this —
      # confirmed via direct curl against a live deploy).
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      # SMTP via Resend temporarily removed — on Coolify, RESEND_API_KEY/
      # RESEND_FROM_ADDRESS/RESEND_FROM_NAME (added after the app's initial
      # setup there) never resolved, stayed literal "${VAR}" text across 3
      # redeploys and a no-cache rebuild, so Zitadel's bootstrap kept failing
      # validation on an empty from-address and crash-looping. Without SMTP
      # config, bootstrap completes fine (confirmed) — the activation email
      # just won't send. Worth re-testing on whatever host actually runs
      # this (that failure was specific to Coolify's variable handling, not
      # a Zitadel or Docker Compose issue) — re-add if var substitution
      # works cleanly there, or configure SMTP via the Console UI after
      # first login instead either way.
    networks:
      - saas-erp-internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.zitadel.rule=Host(`${ZITADEL_DOMAIN}`)
      - traefik.http.routers.zitadel.entryPoints=https
      - traefik.http.routers.zitadel.tls=true
      - traefik.http.routers.zitadel.tls.certresolver=letsencrypt
      - traefik.http.services.zitadel.loadbalancer.server.port=8080

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - pgbouncer
      - mongo
      - redis
      - zitadel
    environment:
      DATABASE_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-saaserp}
      DIRECT_URL: postgres://${POSTGRES_USER:-saaserp}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-saaserp}?schema=public
      MONGO_URL: mongodb://${POSTGRES_USER:-saaserp}:${MONGO_PASSWORD}@mongo:27017/saaserp_audit?authSource=admin
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_PORT: "443"
      OBJECT_STORAGE_USE_SSL: "true"
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-saas-erp-documents}
      ZITADEL_ISSUER: https://${ZITADEL_DOMAIN}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID}
      # Only matters for browser callers — mobile's native HTTP client isn't
      # CORS-restricted at all. Locked to just the web app's own origin;
      # mobile reaches this same public API_DOMAIN directly, no CORS
      # involved on that path.
      CORS_ALLOWED_ORIGINS: https://${WEB_DOMAIN}
      PORT: "3000"
    networks:
      - saas-erp-internal
      - dokploy-network
    labels:
      # Public route exists for the mobile app, which can't use web's
      # same-origin nginx /api proxy trick the way a browser can. The
      # browser still only ever talks to web's own domain though — nothing
      # here changes that path.
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.api.entryPoints=https
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=3000

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Relative path: the browser calls this frontend's own origin, nginx
        # proxies /api/* to the api container internally (apps/web/nginx.conf).
        VITE_API_BASE_URL: /api
        VITE_ZITADEL_ISSUER: https://${ZITADEL_DOMAIN}
        VITE_ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - saas-erp-internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.web.entryPoints=https
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=80

networks:
  saas-erp-internal:
    external: true
  # Whatever network your host's own Traefik listens on. Dokploy creates
  # this one itself during install (see its traefik.yml: providers.docker.network) —
  # don't `docker network create` it, it already exists. A different host's
  # reverse proxy will use a different name; rename this key (and the three
  # references to it above) to match.
  dokploy-network:
    external: true
