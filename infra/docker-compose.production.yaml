# Main production app stack. Postgres and object storage are separate
# resources (see docs/deployment/PRODUCTION_DEPLOY.md) — this file only has
# what talks to them. Object storage is deployed from
# docker-compose.minio.yaml (or any other S3-compatible service) — its own
# resource, since apps/api talks to it as a generic S3 endpoint.
#
# No `ports:` anywhere. Every service sits on `saas-erp-internal` (shared
# with the Postgres and MinIO resources). `web` and `api` also
# join `dokploy-network`, the network Dokploy's own Traefik listens on (see
# that network's own comment further down for naming notes). `api` does get
# a public route — needed for the mobile app, which can't use web's
# same-origin nginx `/api/*` proxy trick the way a browser can (see
# apps/web/nginx.conf) — but the browser itself still only ever calls
# `web`'s own domain; `CORS_ALLOWED_ORIGINS` locks `api` to that origin for
# any browser-based caller regardless.
#
# Usage:
#   docker network create saas-erp-internal   # once, if it doesn't exist yet
#   mkdir -p /data/saas-erp/mongo /data/saas-erp/redis   # once — fixed host
#                                              # paths, survive this resource
#                                              # being deleted and recreated by
#                                              # whatever's managing it (named
#                                              # volumes get a new per-resource
#                                              # identifier and start empty on
#                                              # most PaaS-style Docker hosts —
#                                              # same issue docker-compose.minio.yaml
#                                              # hit)
#   cp .env.deploy.example .env                 # fill in every value, see below
#   docker compose -f docker-compose.production.yaml up -d --build
#
# Required env additions beyond .env.deploy.example (external Postgres and
# object storage, since both resources are deployed separately, not by this
# file):
#   POSTGRES_HOST            internal hostname/service-name your host gives
#                             the Postgres resource (check its connection
#                             details page)
#   POSTGRES_PORT             usually 5432
#   OBJECT_STORAGE_ENDPOINT   object storage's S3 API host, no scheme/port
#                             (its presigned URLs go straight to the browser,
#                             so this has to be the public hostname, not an
#                             internal service name — see PRODUCTION_DEPLOY.md)
#   WEB_DOMAIN                e.g. app.your-domain.example
#   API_DOMAIN                e.g. api.your-domain.example — what the mobile
#                             app points its baseUrl at
#   ZITADEL_ISSUER            public https URL of the separate Zitadel resource
#                             (Zitadel is no longer part of this stack; it runs
#                             as its own resource like Postgres and MinIO)
#   RESEND_API_KEY            from Resend's dashboard — used as the SMTP
#                             password Zitadel authenticates with
#   RESEND_FROM_ADDRESS       must be on a domain verified in Resend, or
#                             every send fails
#   RESEND_FROM_NAME          optional, defaults to "Jiora SaaS ERP"

services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      # app_runtime, not the table owner — see infra/postgres/init for why,
      # and docs/deployment/PRODUCTION_DEPLOY.md for how to create this role
      # on the standalone Postgres resource.
      DATABASE_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD is required}@${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-saaserp}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: "search_path,extra_float_digits"
    networks:
      - saas-erp-internal
      # Dokploy's native Postgres resource isn't on saas-erp-internal — it
      # only lives on dokploy-network (confirmed: zitadel, which is also on
      # dokploy-network, reaches Postgres fine; pgbouncer, which wasn't,
      # couldn't resolve/reach the same host at all). Needed here so
      # pgbouncer's own backend connection to Postgres actually works.
      - dokploy-network

  # ==============================================================================
  # Disabled / Commented Services (Kept for future reference if needed)
  # Per production requirements: Mailpit, Grafana, Loki, Tempo, Mongo, OTEL,
  # and Prometheus are disabled. Zitadel, Redis, PgBouncer, API, and Web remain active.
  # ==============================================================================
  # mongo:
  #   image: mongo:7
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${POSTGRES_USER:-saaserp}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
  #     MONGO_INITDB_DATABASE: saaserp_audit
  #   volumes:
  #     - /data/saas-erp/mongo:/data/db
  #   networks:
  #     - saas-erp-internal

  # mailpit:
  #   image: axllent/mailpit:latest
  #   restart: unless-stopped
  #   environment:
  #     MP_SMTP_AUTH_ACCEPT_ANY: "1"
  #     MP_SMTP_AUTH_ALLOW_INSECURE: "1"
  #   networks:
  #     - saas-erp-internal

  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   restart: unless-stopped
  #   command: ["--config=/etc/otel-collector-config.yaml"]
  #   networks:
  #     - saas-erp-internal

  # tempo:
  #   image: grafana/tempo:latest
  #   restart: unless-stopped
  #   networks:
  #     - saas-erp-internal

  # loki:
  #   image: grafana/loki:latest
  #   restart: unless-stopped
  #   networks:
  #     - saas-erp-internal

  # prometheus:
  #   image: prom/prometheus:latest
  #   restart: unless-stopped
  #   networks:
  #     - saas-erp-internal

  # grafana:
  #   image: grafana/grafana:latest
  #   restart: unless-stopped
  #   networks:
  #     - saas-erp-internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - /data/saas-erp/redis:/data
    networks:
      - saas-erp-internal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - pgbouncer
      - redis
    environment:
      # Runtime traffic: restricted app_runtime role via pgbouncer so RLS applies.
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_runtime:${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD is required}@pgbouncer:5432/${POSTGRES_DB:-saaserp}?pgbouncer=true}
      # Owner role, direct to Postgres: only for `prisma migrate`/seed, never runtime queries.
      DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-saaserp}?schema=public}
      # MONGO_URL: mongodb://${POSTGRES_USER:-saaserp}:${MONGO_PASSWORD}@mongo:27017/saaserp_audit?authSource=admin
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_PORT: ${OBJECT_STORAGE_PORT:-443}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-true}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-saas-erp-documents}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:?ZITADEL_ISSUER is required (public https URL of the separate Zitadel resource)}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:?ZITADEL_PROJECT_ID is required}
      # Invitation emails: Resend SMTP relay (see apps/api/src/mail/services/mail.service.ts)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-}
      WEB_DOMAIN: ${WEB_DOMAIN}
      # Only matters for browser callers — mobile's native HTTP client isn't
      # CORS-restricted at all. Locked to just the web app's own origin;
      # mobile reaches this same public API_DOMAIN directly, no CORS
      # involved on that path.
      CORS_ALLOWED_ORIGINS: https://${WEB_DOMAIN}
      PORT: ${PORT:-3000}
    # No Traefik labels here — same reason as zitadel above: configure this
    # service's domain via Dokploy's own Domains UI (container port 3000)
    # instead of hand-written labels, or the two routers conflict. Public
    # route exists for the mobile app, which can't use web's same-origin
    # nginx /api proxy trick the way a browser can. The browser still only
    # ever talks to web's own domain though — nothing here changes that.
    networks:
      saas-erp-internal:
        # Kong upstreams target api:3000; the extra "backend" alias is kept for older configs.
        aliases:
          - backend
      dokploy-network: {}

  # API gateway. Public API_DOMAIN should now be routed (Dokploy Domains UI)
  # to this service, container port 8000, instead of `api` port 3000. No host
  # port is published; Kong's admin API is internal-only. Config: infra/kong/.
  kong:
    image: kong:3.9
    restart: unless-stopped
    depends_on:
      - api
      - redis
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: auto
      # Per-IP rate limits must see the real client address that web nginx forwards,
      # not the nginx container. Kong is not reachable from outside this network.
      KONG_TRUSTED_IPS: "0.0.0.0/0,::/0"
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-erp-internal
      - dokploy-network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Relative path: the browser calls this frontend's own origin, nginx
        # proxies /api/* to the api container internally (apps/web/nginx.conf).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ZITADEL_ISSUER: ${VITE_ZITADEL_ISSUER:-${ZITADEL_ISSUER}}
        VITE_ZITADEL_CLIENT_ID: ${VITE_ZITADEL_CLIENT_ID:-${ZITADEL_CLIENT_ID}}
    restart: unless-stopped
    depends_on:
      - kong
    # No Traefik labels here either — configure this service's domain via
    # Dokploy's own Domains UI (container port 80, nginx) instead. See the
    # zitadel service's comment above for why: hand-written labels alongside
    # Dokploy's auto-generated ones created two competing routers for the
    # same host — confirmed live, Dokploy's generated router pointed at port
    # 3000 (api's port) while this service actually serves on 80, and the
    # https entryPoint from the losing router never took effect.
    networks:
      - saas-erp-internal
      - dokploy-network

networks:
  saas-erp-internal:
    external: true
  # Whatever network your host's own Traefik listens on. Dokploy creates
  # this one itself during install (see its traefik.yml: providers.docker.network) —
  # don't `docker network create` it, it already exists. A different host's
  # reverse proxy will use a different name; rename this key (and the three
  # references to it above) to match.
  dokploy-network:
    external: true
