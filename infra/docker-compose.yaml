name: saas-erp-dev

# Local development stack: frontend, backend, and Redis.
# Cloud services (PostgreSQL DB, MinIO Object Storage, and Zitadel Auth) are accessed via environment variables.

services:
  redis:
    image: redis:8-alpine
    container_name: saas-erp-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      saas-erp-local-internal:
        aliases:
          - redis

  backend:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: saas-erp-backend
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-saaserpobject.jioratech.com}
      OBJECT_STORAGE_PORT: ${OBJECT_STORAGE_PORT:-443}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-true}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-saas-erp-documents}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-https://authsaaserp.jioratech.com}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-392943311536521733}
      PORT: ${PORT:-3000}
    ports:
      - "3000:3000"
    networks:
      saas-erp-local-internal:
        aliases:
          - backend
          - api

  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ZITADEL_ISSUER: ${VITE_ZITADEL_ISSUER:-https://authsaaserp.jioratech.com}
        VITE_ZITADEL_CLIENT_ID: ${VITE_ZITADEL_CLIENT_ID:-392943470081278469}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: saas-erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"
    networks:
      saas-erp-local-internal:
        aliases:
          - frontend
          - web

networks:
  saas-erp-local-internal:
    name: saas-erp-local-internal

volumes:
  redisdata:
