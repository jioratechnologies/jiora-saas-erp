name: saas-erp-dev

# Unified stack for both local dev and production.
# Cloud services (PostgreSQL DB, MinIO Object Storage, and Zitadel Auth) are
# accessed via environment variables in the .env file.
#
# DATABASE_URL in .env always points to pgbouncer:5432 (service below).
# Pgbouncer then connects to the real Postgres using POSTGRES_HOST/PORT vars.
# DIRECT_URL is kept for Prisma migrations (bypasses pgbouncer, needs superuser).

services:
  redis:
    image: redis:8-alpine
    container_name: saas-erp-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      saas-erp-local-internal:
        aliases:
          - redis

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: saas-erp-pgbouncer
    restart: unless-stopped
    environment:
      # pgbouncer proxies to the real Postgres — can be remote or local
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-app_runtime}:${APP_RUNTIME_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-saaserp}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: "search_path,extra_float_digits"
    networks:
      saas-erp-local-internal:
        aliases:
          - pgbouncer

  backend:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: saas-erp-backend
    restart: unless-stopped
    depends_on:
      - redis
      - pgbouncer
    environment:
      # Always routes through pgbouncer for connection pooling
      DATABASE_URL: ${DATABASE_URL:-postgres://app_runtime:${APP_RUNTIME_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-saaserp}}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-saaserpobject.jioratech.com}
      OBJECT_STORAGE_PORT: ${OBJECT_STORAGE_PORT:-443}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-true}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-saas-erp-documents}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-https://authsaaserp.jioratech.com}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-392943311536521733}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-${APP_PUBLIC_URL:-}}
      PORT: ${PORT:-3000}
    ports:
      - "3000:3000"
    networks:
      saas-erp-local-internal:
        aliases:
          - backend
          - api

  kong:
    image: kong:3.9
    container_name: saas-erp-kong
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: auto
      # Per-IP rate limits must see the real client address that web nginx forwards,
      # not the nginx container. Kong is not reachable from outside this network.
      KONG_TRUSTED_IPS: "0.0.0.0/0,::/0"
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Debug only, localhost-bound. Admin API (8001) is internal and not published.
      - "127.0.0.1:8000:8000"
    networks:
      saas-erp-local-internal:
        aliases:
          - kong

  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ZITADEL_ISSUER: ${VITE_ZITADEL_ISSUER:-https://authsaaserp.jioratech.com}
        VITE_ZITADEL_CLIENT_ID: ${VITE_ZITADEL_CLIENT_ID:-392943470081278469}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: saas-erp-frontend
    restart: unless-stopped
    depends_on:
      - kong
    ports:
      - "5174:80"
    networks:
      saas-erp-local-internal:
        aliases:
          - frontend
          - web

networks:
  saas-erp-local-internal:
    name: saas-erp-local-internal

volumes:
  redisdata:
