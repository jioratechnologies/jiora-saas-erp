# Standalone MinIO deploy for production — its own resource, separate from
# the app stack and from Postgres. No `ports:` mapping (Traefik routes it).
# See docs/deployment/PRODUCTION_DEPLOY.md for full setup steps.
#
# MinIO Inc. discontinued free distribution of the plain community image in
# 2025 (quay.io/minio/minio, docker.io/minio/minio, ghcr.io/minio/minio, and
# the dl.min.io binary all now deny anonymous access, even pinned to old
# release tags — confirmed by testing all four directly). Rather than depend
# on MinIO's AIStor image (needs a license file) or quay.io's anonymous-pull
# policy holding, these are our own mirror of the last working images —
# pulled while quay.io still allowed it, pushed to a plain Docker Hub repo
# we control. No license, no dependency on any third party's access policy.
#
# MINIO_ROOT_USER/PASSWORD are the console/admin login — full control over
# every bucket, every user, the whole server. apps/api never uses these.
# OBJECT_STORAGE_ACCESS_KEY/SECRET_KEY are a separate, scoped user this
# compose file creates on first boot (via `setup`, below), with a policy
# restricted to read/write on OBJECT_STORAGE_BUCKET only — nothing else. If
# that key ever leaks (a log line, a misconfigured error message, whatever),
# it can only touch this one bucket, not the server. Keep the two credential
# pairs different — using the root user as the app's key defeats this.
#
# Usage (on the production host):
#   docker network create saas-erp-internal   # once, if it doesn't exist yet
#   mkdir -p /data/saas-erp/minio             # once — fixed host path, survives
#                                              # this resource being deleted and
#                                              # recreated by whatever's managing
#                                              # it (a named volume would get a
#                                              # new per-resource identifier and
#                                              # start empty on most PaaS-style
#                                              # Docker hosts — Coolify, Dokploy,
#                                              # etc.)
#   cp .env.deploy.example .env                # fill in MINIO_ROOT_*, OBJECT_STORAGE_*, MINIO_DOMAIN
#   docker compose -f docker-compose.minio.yaml up -d

services:
  minio:
    image: bhindwarg/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /data/saas-erp/minio:/data
    networks:
      - saas-erp-internal
      - dokploy-network
    # No healthcheck: this image is our own source build on a distroless
    # base (see infra/minio-build/Dockerfile) — no shell, no `mc`, nothing
    # to run a CMD-style check with. `setup` below polls the S3 API itself
    # instead of depending on a Docker healthcheck gate.
    #
    # No Traefik labels here — configure MINIO_DOMAIN through Dokploy's own
    # Domains UI for this Compose service instead (container port 9000).
    # Hand-written labels alongside Dokploy's auto-generated ones create two
    # competing routers for the same host — confirmed live on web/api/
    # zitadel, same risk here. A host without Dokploy's own Domains UI
    # (plain Traefik, Coolify, etc.) would need labels added back instead.

  # One-shot: creates the bucket, then a scoped non-root user restricted to
  # that bucket only, then attaches a matching policy — then exits. Safe to
  # re-run: every step is idempotent (mc mb --ignore-existing, user add
  # resets the password rather than erroring, policy create/attach on an
  # unchanged policy no-ops). Re-run with
  # `docker compose -f docker-compose.minio.yaml up setup` after changing
  # OBJECT_STORAGE_BUCKET or rotating OBJECT_STORAGE_SECRET_KEY.
  setup:
    image: bhindwarg/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-saas-erp-documents}
    # entrypoint MUST use "|" (literal block), not ">" (folded) — folded
    # style collapses every newline below into a space, which silently
    # destroys the heredoc (it needs a real newline to find its EOF
    # terminator). Confirmed live: with ">", the policy.json heredoc failed
    # ("cat: '{': No such file or directory") on every run, meaning the
    # scoped IAM policy was never created or attached — OBJECT_STORAGE_
    # ACCESS_KEY had full unrestricted access instead of being locked to
    # just this one bucket. Don't change this back to ">".
    entrypoint: |
      sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done &&
      mc mb --ignore-existing local/$$OBJECT_STORAGE_BUCKET &&
      mc admin user add local $$OBJECT_STORAGE_ACCESS_KEY $$OBJECT_STORAGE_SECRET_KEY &&
      cat > /tmp/policy.json <<EOF
      {
        \"Version\": \"2012-10-17\",
        \"Statement\": [
          {\"Effect\": \"Allow\", \"Action\": [\"s3:GetObject\", \"s3:PutObject\", \"s3:DeleteObject\"], \"Resource\": [\"arn:aws:s3:::$$OBJECT_STORAGE_BUCKET/*\"]},
          {\"Effect\": \"Allow\", \"Action\": [\"s3:ListBucket\"], \"Resource\": [\"arn:aws:s3:::$$OBJECT_STORAGE_BUCKET\"]}
        ]
      }
      EOF
      mc admin policy create local saas-erp-app-policy /tmp/policy.json &&
      mc admin policy attach local saas-erp-app-policy --user $$OBJECT_STORAGE_ACCESS_KEY
      "
    networks:
      - saas-erp-internal
    restart: "no"

networks:
  saas-erp-internal:
    external: true
  # Whatever network your host's own Traefik listens on. Dokploy creates
  # this one itself during install (see its traefik.yml: providers.docker.network) —
  # don't `docker network create` it, it already exists. A different host's
  # reverse proxy will use a different name; rename this key (and the
  # reference to it above) to match.
  dokploy-network:
    external: true
